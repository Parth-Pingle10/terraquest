version: "3.8"

services:
  # TerraQuest FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terraquest-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=terraquest
      - JWT_SECRET_KEY=change-this-in-production-to-a-secure-secret-32-chars
      - SHARE_TOKEN_SALT=terraquest-salt-docker-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - OLLAMA_VISION_MODEL=moondream:latest
      - OLLAMA_TIMEOUT_SECONDS=15.0
      - OLLAMA_VISION_TIMEOUT_SECONDS=25.0
    depends_on:
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MongoDB Service (Shared persistence for maps, discoveries, shares, quests)
  mongodb:
    image: mongo:7.0
    container_name: terraquest-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Ollama Local AI Service (Vision + LLM)
  # Model weights are stored strictly in the persistent volume 'ollama-models'
  # Model files are NEVER baked into the backend application container image.
  ollama:
    image: ollama/ollama:latest
    container_name: terraquest-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local
  ollama-models:
    driver: local
