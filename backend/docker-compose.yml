services:
  # TerraQuest FastAPI Backend (Zero-Database Architecture)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraquest-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_MODEL=moondream:v2
      - OLLAMA_TIMEOUT_SECONDS=60
      - ENABLE_VISION_MODEL=false
      - JWT_SECRET_KEY=change-this-in-production-to-a-secure-secret-32-chars
      - SHARE_TOKEN_SALT=terraquest-salt-docker-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
