services:
  - type: web
    name: terraquest
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: OLLAMA_MODEL
        value: "moondream:v2"
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
      - key: ENABLE_VISION_MODEL
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SHARE_TOKEN_SALT
        generateValue: true
