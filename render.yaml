services:
  - type: web
    name: terraquest
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: ENABLE_VISION_MODEL
        value: "false"
      - key: MONGODB_DB_NAME
        value: terraquest
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: your external MongoDB Atlas connection URI
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SHARE_TOKEN_SALT
        generateValue: true
