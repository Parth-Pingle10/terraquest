services:
  # ------------------------------------------------------------------------------
  # Unified TerraQuest Web Service (FastAPI + Built React SPA)
  # Zero-database dependency: In-memory store + Client-side LocalStorage persistence
  # ------------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraquest-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - OLLAMA_MODEL=moondream:v2
      - OLLAMA_TIMEOUT_SECONDS=60
      - ENABLE_VISION_MODEL=false
      - JWT_SECRET_KEY=dev-secret-key-for-local-docker-testing-only-32ch
      - SHARE_TOKEN_SALT=terraquest-compose-salt-32chars-min
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------------
  # Optional Local Ollama Service (Moondream:v2 Vision-Language Inference)
  # Model weights are stored in 'ollama-models' volume and never baked into Docker images.
  # Start with: docker compose --profile ai up
  # ------------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: terraquest-ollama
    restart: unless-stopped
    profiles: ["ai", "full"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  ollama-models:
    driver: local
