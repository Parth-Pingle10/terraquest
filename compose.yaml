services:
  # ------------------------------------------------------------------------------
  # Unified TerraQuest Web Service (FastAPI + Built React SPA)
  # ------------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraquest-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=terraquest
      - LLAMA_CPP_BASE_URL=http://llama:8080
      - LLAMA_CPP_MODEL_PATH=/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - ENABLE_VISION_MODEL=false
      - JWT_SECRET_KEY=dev-secret-key-for-local-docker-testing-only-32ch
      - SHARE_TOKEN_SALT=terraquest-compose-salt-32chars-min
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------------
  # MongoDB Persistence Service
  # ------------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: terraquest-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------------------------
  # llama.cpp Official Server Container (Local GGUF Text Inference)
  # Uses Qwen 2.5 0.5B Instruct Q4_K_M (~398 MB) mounted via ./models volume.
  # Run with: docker compose --profile ai up
  # ------------------------------------------------------------------------------
  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: terraquest-llamacpp
    restart: unless-stopped
    profiles: ["ai", "full"]
    command: >
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      -c 2048
      -n 512
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local
